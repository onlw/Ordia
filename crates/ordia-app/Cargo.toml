[package]
name = "ordia-app"
description = "Ordia cross-platform desktop office suite application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "ordia-app"

[lib]
name = "ordia_app"
path = "src/lib.rs"

[[bin]]
name = "ordia-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
clap.workspace = true
encoding_rs.workspace = true
gpui-kit.workspace = true
ordia-core.workspace = true
ordia-i18n.workspace = true
ordia-render-pdf.workspace = true
ordia-text.workspace = true
ordia-ui.workspace = true
ordia-sheet-model.workspace = true
ordia-sheet-view.workspace = true
ordia-xlsx.workspace = true
ordia-csv.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
