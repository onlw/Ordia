name: Release

on:
  push:
    tags:
      - "v*"
      - "nightly-*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-bundles:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: "target/bundle/*.dmg"
          - os: windows-latest
            artifact_glob: "target/bundle/*.msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.100.0
      - name: Build installer bundle via cargo xtask bundle
        run: cargo xtask bundle
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            ${{ matrix.artifact_glob }}
            assets/THIRD_PARTY_LICENSES.txt

  publish-github-release:
    name: Publish GitHub Release
    needs: build-bundles
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA256SUMS.txt
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'nightly') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: dist/*
